name: CI

on:
  push:
    branches: ["main", "dev/hw4"]
  pull_request:
    branches: ["main", "dev/hw4"]

jobs:
  go-unit:
    name: Go tests (${{ matrix.module_name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - module_name: api-gateway
            module_dir: services/api-gateway
            go_mod: services/api-gateway/go.mod
          - module_name: orders-service
            module_dir: services/orders-service
            go_mod: services/orders-service/go.mod
          - module_name: payments-service
            module_dir: services/payments-service
            go_mod: services/payments-service/go.mod

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache: true
          cache-dependency-path: |
            services/api-gateway/go.sum
            services/orders-service/go.sum
            services/payments-service/go.sum

      - name: Download deps
        working-directory: ${{ matrix.module_dir }}
        run: go mod download

      - name: Run unit tests
        working-directory: ${{ matrix.module_dir }}
        run: go test ./... -count=1 -timeout=10m

  deploy:
    name: Deploy (after tests)
    needs: [go-unit]
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/cd-dev-hw-4.yaml
    secrets: inherit
    with:
      checkout_ref: ${{ github.sha }}
      deploy_branch: ${{ github.ref_name }}
